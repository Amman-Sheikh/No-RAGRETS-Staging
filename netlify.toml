[build]
  publish = "."
  functions = "netlify/functions"

# Functions are bundled with esbuild by default on Netlify — no extra config needed
# for this handler since it only uses Node's built-in fetch/AbortController.

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
